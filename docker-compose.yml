services:
  postgres:
    image: postgres:16-alpine
    container_name: jobscheduler-pg
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jobscheduler-pgdata:/var/lib/postgresql/data

volumes:
  jobscheduler-pgdata: